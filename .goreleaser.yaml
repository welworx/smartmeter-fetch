version: 2

builds:
  - id: smartmeter-fetch
    binary: smartmeter-fetch
    main: .
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -X main.version={{ .Tag }}

archives:
  - id: smartmeter-fetch
    formats: [binary]
    name_template: "smartmeter-fetch-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "SHA256SUMS.txt"
  algorithm: sha256

dockers:
  - id: smartmeter-fetch-amd64
    ids: [smartmeter-fetch]
    goos: linux
    goarch: amd64
    dockerfile: Containerfile
    use: buildx
    image_templates:
      - "ghcr.io/welworx/smartmeter-fetch:{{ .Tag }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      # image.source links the GHCR package to this repo (still needs a
      # one-time manual flip to public after the first push).
      - "--label=org.opencontainers.image.source=https://github.com/welworx/smartmeter-fetch"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
  - id: smartmeter-fetch-arm64
    ids: [smartmeter-fetch]
    goos: linux
    goarch: arm64
    dockerfile: Containerfile
    use: buildx
    image_templates:
      - "ghcr.io/welworx/smartmeter-fetch:{{ .Tag }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.source=https://github.com/welworx/smartmeter-fetch"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"

docker_manifests:
  - name_template: "ghcr.io/welworx/smartmeter-fetch:{{ .Tag }}"
    image_templates:
      - "ghcr.io/welworx/smartmeter-fetch:{{ .Tag }}-amd64"
      - "ghcr.io/welworx/smartmeter-fetch:{{ .Tag }}-arm64"
  - name_template: "ghcr.io/welworx/smartmeter-fetch:latest"
    image_templates:
      - "ghcr.io/welworx/smartmeter-fetch:{{ .Tag }}-amd64"
      - "ghcr.io/welworx/smartmeter-fetch:{{ .Tag }}-arm64"

release:
  github:
    owner: welworx
    name: smartmeter-fetch
