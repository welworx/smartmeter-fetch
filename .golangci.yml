version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - dupword
    - errcheck
    - errname
    - gosec
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
    - whitespace
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
      - linters:
          - gosec
        text: G602 # false positive: len(args) is validated in parseNameProviderArgs before args[1] is read, gosec can't trace it across the call
      - linters:
          - gosec
        text: G117 # expected: fields are marshaled deliberately (encrypted credential storage / portal login API payload), not leaked
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
